<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Bot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        
        .chat-container {
            height: calc(100vh - 140px);
        }
        
        .message-enter {
            animation: messageEnter 0.3s ease-out;
        }
        
        @keyframes messageEnter {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .typing-indicator span {
            animation: typing 1.4s infinite both;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }
        
        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }
        
        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 bg-black/40 backdrop-blur-xl border-b border-white/10 z-50">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center">
                    <i class="fas fa-robot text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">AI Assistant</h1>
                    <p class="text-xs text-green-400 flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                        Online
                    </p>
                </div>
            </div>
            <button onclick="clearChat()" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition-all">
                <i class="fas fa-trash mr-2"></i>Clear Chat
            </button>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="pt-20 pb-24 px-4">
        <div class="max-w-5xl mx-auto">
            <div id="chatBox" class="chat-container scrollbar-thin overflow-y-auto space-y-4">
                <!-- Welcome Message -->
                <div class="message-enter flex items-start gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-white"></i>
                    </div>
                    <div class="bg-white/10 backdrop-blur-sm rounded-2xl rounded-tl-none px-5 py-3 max-w-[80%]">
                        <p class="text-white">Hello! 👋 I'm your AI assistant powered by GPT-5.4-mini. How can I help you today?</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Input Area -->
    <footer class="fixed bottom-0 left-0 right-0 bg-black/40 backdrop-blur-xl border-t border-white/10">
        <div class="max-w-5xl mx-auto px-4 py-4">
            <form id="chatForm" class="flex gap-3">
                <div class="flex-1 relative">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="Type your message..." 
                        autocomplete="off"
                        class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 pr-12 text-white placeholder-white/50 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 transition-all"
                    >
                    <button type="button" onclick="document.getElementById('userInput').value=''" class="absolute right-4 top-1/2 -translate-y-1/2 text-white/50 hover:text-white">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <button 
                    type="submit" 
                    id="sendBtn"
                    class="px-6 py-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 rounded-2xl text-white font-medium transition-all active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </footer>

    <script>
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        
        let messages = [];
        let isLoading = false;

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatContent(text) {
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function addMessage(content, isUser = false, isReasoning = false) {
            const div = document.createElement('div');
            div.className = `message-enter flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;
            
            if (isUser) {
                div.innerHTML = `
                    <div class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-user text-white"></i>
                    </div>
                    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-2xl rounded-tr-none px-5 py-3 max-w-[80%]">
                        <p class="text-white">${escapeHtml(content)}</p>
                    </div>
                `;
            } else if (isReasoning) {
                div.innerHTML = `
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-white"></i>
                    </div>
                    <div class="bg-amber-500/20 backdrop-blur-sm border border-amber-500/30 rounded-2xl rounded-tl-none px-5 py-3 max-w-[80%]">
                        <p class="text-amber-200 text-sm"><i class="fas fa-lightbulb mr-2"></i>${escapeHtml(content)}</p>
                    </div>
                `;
            } else {
                div.innerHTML = `
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-white"></i>
                    </div>
                    <div class="bg-white/10 backdrop-blur-sm rounded-2xl rounded-tl-none px-5 py-3 max-w-[80%]">
                        <p class="text-white whitespace-pre-wrap">${formatContent(content)}</p>
                    </div>
                `;
            }
            
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function showTypingIndicator() {
            const div = document.createElement('div');
            div.id = 'typingIndicator';
            div.className = 'message-enter flex items-start gap-3';
            div.innerHTML = `
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-white"></i>
                </div>
                <div class="bg-white/10 backdrop-blur-sm rounded-2xl rounded-tl-none px-5 py-4">
                    <div class="typing-indicator flex gap-1">
                        <span class="w-2 h-2 bg-white/60 rounded-full"></span>
                        <span class="w-2 h-2 bg-white/60 rounded-full"></span>
                        <span class="w-2 h-2 bg-white/60 rounded-full"></span>
                    </div>
                </div>
            `;
            chatBox.appendChild(div);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage(e) {
            e.preventDefault();
            
            const message = userInput.value.trim();
            if (!message || isLoading) return;
            
            isLoading = true;
            sendBtn.disabled = true;
            
            // Add user message
            addMessage(message, true);
            messages.push({ role: 'user', content: message });
            userInput.value = '';
            
            showTypingIndicator();
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (window.OPENROUTER_API_KEY || '$OPENROUTER_API_KEY')
                    },
                    body: JSON.stringify({
                        model: 'openai/gpt-5.4-mini',
                        messages: messages,
                        reasoning: {
                            enabled: true
                        }
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                removeTypingIndicator();
                
                const assistantMessage = data.choices[0].message.content;
                messages.push({ role: 'assistant', content: assistantMessage });
                addMessage(assistantMessage);
                
                // Show reasoning if available
                if (data.choices[0].message.reasoning) {
                    addMessage(data.choices[0].message.reasoning, false, true);
                }
                
            } catch (error) {
                removeTypingIndicator();
                addMessage(`Error: ${error.message}. Please set your OPENROUTER_API_KEY.`);
                console.error('Error:', error);
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        function clearChat() {
            messages = [];
            chatBox.innerHTML = `
                <div class="message-enter flex items-start gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-white"></i>
                    </div>
                    <div class="bg-white/10 backdrop-blur-sm rounded-2xl rounded-tl-none px-5 py-3 max-w-[80%]">
                        <p class="text-white">Chat cleared! How can I help you? 🤖</p>
                    </div>
                </div>
            `;
        }

        chatForm.addEventListener('submit', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage(e);
            }
        });
    </script>
</body>
</html>
